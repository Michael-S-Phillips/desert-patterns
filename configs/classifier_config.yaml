classifier:
  model_type: logistic_regression
  cv_folds: 5
  random_state: 42
  max_iter: 1000
  class_weight: balanced

dino:
  model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
  input_size: 518
  batch_size: 32
  device: auto

data:
  image_dir: data/kim_2023/checked-images
  label_map:
    "1609 Mudcrack no mat": mudcrack
    "Big Pool no mat 1": big_pool
    "Big Pool no mat 2": big_pool
    "Big Pool no mat 3": big_pool
    "Big Pool no mat 4": big_pool
    "JBIO mat": jbio
    "JBIO pond": jbio
    "JBIO wet mat ": jbio  # trailing space matches filesystem folder name; code strips before lookup

output:
  model_dir: outputs/models/classifier
  figures_dir: outputs/figures
  embedding_cache: outputs/features/classifier_embeddings.npy
  label_cache: outputs/features/classifier_labels.npy

segmentation:
  sam_checkpoint: /Volumes/Rohan/Software/sam/sam_vit_b_01ec64.pth
  output_dir: outputs/segmentations
  n_foreground_prompts: 5
  n_background_prompts: 5
  threshold_method: otsu          # otsu | percentile
  attention_percentile: 0.70      # used only when threshold_method=percentile
  min_mask_area_fraction: 0.005
  iou_dedup_threshold: 0.5
  attention_mode: classifier          # classifier | self_attention
  prompt_strategy: topk               # topk | fps
  sam_version: sam1                   # sam1 | sam2
  sam2_checkpoint: ""
  sam2_model_cfg: sam2_hiera_b+.yaml

clasp:
  output_dir: outputs/segmentations_clasp
  bandwidth: 0.5
  min_clusters: 2
  max_clusters: 15
  dense_crf: true
  crf_iterations: 20
  crf_gt_prob: 0.8
  crf_gaussian_sxy: 4
  crf_gaussian_compat: 4
  crf_bilateral_sxy: 80
  crf_bilateral_srgb: 13
  crf_bilateral_compat: 10
